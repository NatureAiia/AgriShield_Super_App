  <defs>
    <linearGradient id="shieldFillIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <path d="M40 2 L74 14 L74 44 C74 66 58 78 40 86 C22 78 6 66 6 44 L6 14 Z"
        fill="url(#shieldFillIcon)" stroke="#064E3B" stroke-width="2"/>
  <path d="M40 20
           C56 24 60 40 52 54
           C46 64 40 66 40 66
           C40 66 34 64 28 54
           C20 40 24 24 40 20 Z"
        fill="#F1F8F4"/>
  <path d="M40 22 L40 64" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="42" r="3.5" fill="#F59E0B"/>
</svg>
