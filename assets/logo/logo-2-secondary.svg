<!--
  AgriShield — Logo 2 (SECONDARY: icon-only mark)
  Same shield+leaf mark as logo-1-main.svg, without the wordmark. Use for
  app icons, favicons, small UI chips, and anywhere the full lockup won't
  fit (nav bar avatar, loading spinner, social profile image).
-->
