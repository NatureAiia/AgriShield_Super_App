<!--
  AgriShield — Logo 1 (MAIN)
  Full lockup: shield+leaf mark plus wordmark. Use this as the primary logo
  wherever there's room for the full lockup (README header, app splash,
  pitch deck cover, favicon fallback with the mark alone — see logo-2).
  Palette matches /prototype/AgriShieldApp.jsx: emerald #064E3B / #10B981,
  amber #F59E0B accent.
-->
<svg width="360" height="96" viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgriShield logo">
  <defs>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Mark: shield with a leaf cut out -->
  <g transform="translate(8,8)">
    <path d="M40 2 L74 14 L74 44 C74 66 58 78 40 86 C22 78 6 66 6 44 L6 14 Z"
          fill="url(#shieldFill)" stroke="#064E3B" stroke-width="2"/>
    <path d="M40 20
             C56 24 60 40 52 54
             C46 64 40 66 40 66
             C40 66 34 64 28 54
             C20 40 24 24 40 20 Z"
          fill="#F1F8F4"/>
    <path d="M40 22 L40 64" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="42" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="46" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#064E3B">Agri<tspan fill="#10B981">Shield</tspan></text>
  <text x="101" y="68" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#6B7280">CLIMATE &amp; YIELD RESILIENCE</text>
</svg>
