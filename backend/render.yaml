# Render deploy: https://dashboard.render.com → New → Blueprint → point at repo.
# Fill in AFRICASTALKING_* later; leave GEE empty for mock satellite.
services:
  - type: web
    name: agrishield-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrishield-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to the hosted webapp URL, e.g. https://agrishield.vercel.app
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false

databases:
  - name: agrishield-db
    plan: free
